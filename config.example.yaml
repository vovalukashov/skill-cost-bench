# Example: measuring Graphify against a bare Claude Code on one repository.
#
# Nothing in the harness knows what Graphify is. An arm is a name, an
# environment, a few flags, and the patterns that prove the skill ran. Swap the
# arm block and the same code measures a different skill.

run:
  name: graphify-pilot
  seed: 20260806
  repeats: 3               # repeats exist to measure noise, not to add sample size
  budget_usd: 40.0         # hard stop; the sweep records what it did not run
  out_dir: out
  tasks_file: tasks/tasks.yaml
  bootstrap_resamples: 10000

target:
  repo: /path/to/the/repository/under/test
  # {tests} is replaced by the restored test paths, shell-quoted.
  test_cmd: "python -m pytest -q {tests}"
  test_timeout_s: 900
  # Run once per worktree before the agent starts (deps, build, venv).
  setup_cmd: null
  setup_timeout_s: 1800
  worktree_root: /tmp/skill-cost-bench-worktrees
  # Removed from every worktree in BOTH arms, so neither inherits repository
  # instructions or a stray skill directory that only one arm would see.
  strip_paths:
    - .claude
    - CLAUDE.md
    - AGENTS.md

agent:
  bin: claude
  model: claude-sonnet-5
  effort: low
  permission_mode: acceptEdits
  max_budget_usd: 3.0      # per-session guard rail on top of the sweep budget
  timeout_s: 1800
  extra_args:
    - --no-session-persistence
    - --setting-sources
    - ""
    - --strict-mcp-config
    - --dangerously-skip-permissions

# The skill's index: built once in a reference checkout, priced on its own line,
# then copied into each experimental worktree. Leave build_cmd empty for skills
# that have no index.
index:
  # Local AST extraction only. Graphify's full mode sends documents and images
  # to an LLM for semantic extraction, which needs an API key this run does not
  # have — and the claim under test is about navigating code, so the code graph
  # is the honest subject. Recorded as a limitation, not hidden.
  #
  # The build also copies the skill's own text into the index directory, so the
  # agent can read the full instructions on demand. The system prompt carries
  # only the skill's description and a pointer, which is how Claude Code loads a
  # skill in normal use: appending all 41KB to every request would charge the
  # experimental arm for context a real user never pays on every turn.
  build_cmd: '/Users/luka/Projects/skill-cost-bench/.venv/bin/graphify extract . --code-only && cp -R "$HOME/.claude/skills/graphify/SKILL.md" "$HOME/.claude/skills/graphify/references" graphify-out/'
  build_timeout_s: 7200
  # Only what a query needs. `cache/` and `manifest.json` exist for incremental
  # re-extraction and are 80MB of dead weight to copy into every worktree.
  paths:
    - graphify-out/graph.json
    - graphify-out/.graphify_analysis.json
    - graphify-out/SKILL.md
    - graphify-out/references
  refresh_cmd: null

# Both arms start from the same bare session: --setting-sources "" drops user,
# project and local settings, --strict-mcp-config drops every MCP server that did
# not come from --mcp-config, and --disable-slash-commands drops ALL skills,
# including the forty living in the operator's ~/.claude. The experimental arm
# then gets its one skill back explicitly: the MCP server plus the skill's own
# markdown appended to the system prompt.
#
# A separate CLAUDE_CONFIG_DIR per arm would be tidier in principle and does
# isolate correctly, but a fresh config directory cannot authenticate: the CLI
# reports "Not logged in". Flags it is. preflight.py prints what each arm was
# actually handed, which is the thing that matters either way.
arms:
  - name: control
    label: A
    args:
      - --disable-slash-commands
    forbidden_patterns:
      - graphify
    expect_absent:
      - graphify

  - name: graphify
    label: B
    use_index: true
    args:
      - --disable-slash-commands
      - --mcp-config
      - .arms/graphify-mcp.json
    append_system_prompt_file: .arms/graphify-SKILL.md
    # Traces that prove the skill actually ran. Without a hit the run is invalid,
    # not zero.
    activation_patterns:
      - "mcp__graphify__"
      - "graphify-out/graph\\.json"
      - "(?m)^/graphify\\b"
    expect_present:
      - graphify

claim:
  factor: 70.0
  source: "https://github.com/Graphify-Labs/graphify"
  note: >
    71.5x fewer tokens per query than reading the raw files, measured by the
    authors on a 52-file corpus of Karpathy repositories, five papers and four
    images. That is a retrieval claim. This harness measures a different thing:
    the cost of a task carried to green tests.

# USD per million tokens. Cost is computed from token counts against this table
# rather than read from the session's own `total_cost_usd`, which is zero or
# absent on a subscription. Publishing the token counts means a reader can
# re-price the whole run at different rates without re-running it.
pricing:
  source: "https://platform.claude.com/docs/en/about-claude/models/overview"
  dated: "2026-08-06"
  note: >
    Standard list rates. Claude Sonnet 5 carries an introductory $2.00/$10.00
    through 2026-08-31, which covers this run; the standard rate is used because
    it is the one a reader reproducing this later will pay. The choice barely
    moves the headline: the metric is a ratio between two arms, so a uniform
    price change cancels out except through the input/output/cache mix.
    Cache write is 1.25x input at the 5-minute TTL and 2x at one hour; cache
    read is 0.1x input.
  claude-sonnet-5:
    input: 3.00
    output: 15.00
    cache_write_5m: 3.75
    cache_write_1h: 6.00
    cache_read: 0.30
  claude-opus-5:
    input: 5.00
    output: 25.00
    cache_write_5m: 6.25
    cache_write_1h: 10.00
    cache_read: 0.50
  claude-haiku-4-5:
    input: 1.00
    output: 5.00
    cache_write_5m: 1.25
    cache_write_1h: 2.00
    cache_read: 0.10
