# Stock-install run: the skill as its users actually install it.
#
# The earlier sweeps handed the skill over the way the harness found convenient
# — an MCP server plus the skill's description in the system prompt — and then
# added a graph-first procedure of my own when the model would not reach for it.
# Both are the harness talking. The product ships something else: `graphify
# install --project` writes a CLAUDE.md section and two PreToolUse hooks, and
# those hooks push "you MUST query the graph before reading source files" into
# the session ahead of every read, glob, grep and search. `--strict` goes
# further and refuses the first raw file read of a session outright.
#
# So this run measures three arms against one control, sharing it:
#   graphify-stock   — the default install, hooks nudging on every read
#   graphify-strict  — the same plus --strict, first raw read blocked
# Analysed one pair at a time: scripts/analyze.py --experiment graphify-strict.
#
# What still is not stock: slash commands stay disabled in both arms. Enabling
# them would restore all forty-odd skills that live in ~/.claude to the control
# arm as well, and a separate CLAUDE_CONFIG_DIR loses the CLI's login. The cost
# is the `/graphify` command, which nothing in a headless run would type; the
# skill file, the CLAUDE.md section and the hooks are all present.

run:
  name: graphify-superset-stock
  seed: 20260905
  repeats: 2
  budget_usd: 260.0
  out_dir: out
  tasks_file: tasks/superset.tasks.yaml
  max_tasks: 80
  bootstrap_resamples: 10000

target:
  repo: .targets/superset
  test_cmd: "/Users/luka/Projects/skill-cost-bench/.targets/superset/.venv-superset/bin/python -m pytest -q --no-header -p no:cacheprovider {tests}"
  test_timeout_s: 900
  setup_cmd: null
  worktree_root: /tmp/repo-work
  # Stripped in every arm, so no arm inherits guidance another one lacks. The
  # skill's own installer runs after this, which is what makes its CLAUDE.md
  # section the only agent instruction in the experimental trees.
  strip_paths:
    - .claude
    - CLAUDE.md
    - AGENTS.md
    - .cursor

index:
  build_cmd: '/Users/luka/Projects/skill-cost-bench/.venv/bin/graphify extract . --code-only'
  build_timeout_s: 10800
  # No SKILL.md copy this time: the installer puts the skill in the tree itself.
  paths:
    - graphify-out/graph.json
    - graphify-out/.graphify_analysis.json
  # Indexes are keyed by the commit they were built at, and the main sweep built
  # one per task on the same 80 tasks. Reusing them keeps two hours of CPU and
  # 8.5GB out of this run without changing what any session sees.
  reuse_from: out/20260807T100106Z-graphify-superset-main
  refresh_cmd: null

agent:
  bin: claude
  model: claude-sonnet-5
  effort: low
  permission_mode: acceptEdits
  max_budget_usd: 3.0
  timeout_s: 1800
  extra_args:
    - --no-session-persistence
    - --strict-mcp-config
    - --dangerously-skip-permissions
    # Hook firings land in the transcript, so "the tool prompted the model" is
    # recorded rather than inferred.
    - --include-hook-events

# A clean PATH in both arms: the sweep is launched from a shell whose PATH
# carries session-scoped plugin directories that would not exist on a rerun.
# The one difference between the arms is the skill's own CLI, which is the
# thing under test.
_path: &base_path "/Users/luka/.nvm/versions/node/v24.20.0/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"

arms:
  - name: control
    label: A
    env:
      PATH: *base_path
    args:
      - --disable-slash-commands
      # No user or project settings: no skills, no hooks, nothing the
      # experimental arms get.
      - --setting-sources
      - ""
    forbidden_patterns:
      - graphify
    expect_absent:
      - graphify

  - name: graphify-stock
    label: B
    use_index: true
    env:
      PATH: "/Users/luka/Projects/skill-cost-bench/.venv/bin:/Users/luka/.nvm/versions/node/v24.20.0/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
    setup_cmd: "/Users/luka/Projects/skill-cost-bench/.venv/bin/graphify install --project"
    setup_timeout_s: 300
    args:
      - --disable-slash-commands
      # Project settings only: this is what loads the hooks the installer just
      # registered in .claude/settings.json, and nothing from ~/.claude.
      - --setting-sources
      - project
    # Use is a call to the skill's CLI. The hook's own reminder names the same
    # command, but it arrives as text, and text is not counted as a call.
    activation_patterns:
      - "graphify (query|explain|path|stats|extract)"
      - "graphify-out/graph\\.json"
    # What the product says to the model on its own initiative.
    nudge_patterns:
      - "MANDATORY: graphify-out"

  - name: graphify-strict
    label: C
    use_index: true
    env:
      PATH: "/Users/luka/Projects/skill-cost-bench/.venv/bin:/Users/luka/.nvm/versions/node/v24.20.0/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
    setup_cmd: "/Users/luka/Projects/skill-cost-bench/.venv/bin/graphify install --project --strict"
    setup_timeout_s: 300
    args:
      - --disable-slash-commands
      - --setting-sources
      - project
    activation_patterns:
      - "graphify (query|explain|path|stats|extract)"
      - "graphify-out/graph\\.json"
    nudge_patterns:
      - "MANDATORY: graphify-out"
      # Strict mode's other voice: it refuses the first raw read of a session
      # outright. Counted here so a run where it fired is distinguishable from
      # one where the soft reminder got there first — which, on the smoke task,
      # is what happened: the model opened with a grep, the search hook nudged
      # it, it queried the graph, and by its first Read the block no longer
      # applied.
      - "graphify strict mode"

claim:
  factor: 70.0
  source: "https://github.com/Graphify-Labs/graphify"
  note: >
    71.5x fewer tokens per query than reading the raw files, measured by the
    authors on a 52-file corpus. The figure stood in the README through the
    spring and is gone from the current one; it is quoted here as the claim this
    harness was built to test, dated. That is a retrieval claim; this run
    measures the cost of a task carried to green tests.

# USD per million tokens. Cost is computed from token counts against this table
# rather than read from the session's own `total_cost_usd`, which is populated
# and accurate on a subscription and kept as a cross-check. Publishing the token
# counts means a reader can re-price the whole run without re-running it.
pricing:
  source: "https://platform.claude.com/docs/en/about-claude/pricing"
  dated: "2026-09-05"
  note: >
    Standard list rates as published on the date above. The $2.00/$10.00 that
    Claude Sonnet 5 launched with as introductory pricing through 2026-08-31 is
    now the standard rate: the increase to $3.00/$15.00 scheduled for
    2026-09-01 was cancelled. Earlier runs in this repository were priced at
    $3.00/$15.00 and their dollar figures are 1.5x these; the ratio between arms
    is unaffected, because a uniform price change cancels except through the
    input/output/cache mix. Cache write is 1.25x input at the five-minute TTL
    and 2x at one hour; cache read is 0.1x input.
  claude-sonnet-5:
    input: 2.00
    output: 10.00
    cache_write_5m: 2.50
    cache_write_1h: 4.00
    cache_read: 0.20
  claude-opus-5:
    input: 5.00
    output: 25.00
    cache_write_5m: 6.25
    cache_write_1h: 10.00
    cache_read: 0.50
  claude-haiku-4-5:
    input: 1.00
    output: 5.00
    cache_write_5m: 1.25
    cache_write_1h: 2.00
    cache_read: 0.10
