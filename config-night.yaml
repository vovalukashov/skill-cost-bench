# Secondary run: a much smaller codebase, to see how the effect behaves when
# there is little to read in the first place.

run:
  name: graphify-night-pilot
  seed: 20260806
  repeats: 3
  budget_usd: 25.0
  out_dir: out
  tasks_file: tasks/night.tasks.yaml
  max_tasks: 8
  bootstrap_resamples: 10000

target:
  repo: /Users/luka/Projects/night
  test_cmd: "./node_modules/.bin/vitest run {tests}"
  test_timeout_s: 600
  # pnpm would purge a symlinked modules directory without a TTY, so the tests
  # call the vitest binary directly and the dependencies are shared, not
  # reinstalled per worktree.
  setup_cmd: "ln -sfn /Users/luka/Projects/night/node_modules node_modules"
  setup_timeout_s: 120
  worktree_root: /tmp/repo-work-b
  strip_paths:
    - .claude
    - CLAUDE.md
    - AGENTS.md

index:
  # Local AST extraction only. Graphify's full mode sends documents and images
  # to an LLM for semantic extraction, which needs an API key this run does not
  # have — and the claim under test is about navigating code, so the code graph
  # is the honest subject. Recorded as a limitation, not hidden.
  #
  # The build also copies the skill's own text into the index directory, so the
  # agent can read the full instructions on demand. The system prompt carries
  # only the skill's description and a pointer, which is how Claude Code loads a
  # skill in normal use: appending all 41KB to every request would charge the
  # experimental arm for context a real user never pays on every turn.
  build_cmd: '/Users/luka/Projects/skill-cost-bench/.venv/bin/graphify extract . --code-only && cp -R "$HOME/.claude/skills/graphify/SKILL.md" "$HOME/.claude/skills/graphify/references" graphify-out/'
  build_timeout_s: 3600
  # Only what a query needs. `cache/` and `manifest.json` exist for incremental
  # re-extraction and are 80MB of dead weight to copy into every worktree.
  paths:
    - graphify-out/graph.json
    - graphify-out/.graphify_analysis.json
    - graphify-out/SKILL.md
    - graphify-out/references
  refresh_cmd: null

agent:
  bin: claude
  model: claude-sonnet-5
  effort: low
  permission_mode: acceptEdits
  max_budget_usd: 3.0
  timeout_s: 1800
  extra_args:
    - --no-session-persistence
    - --setting-sources
    - ""
    - --strict-mcp-config
    - --dangerously-skip-permissions

arms:
  - name: control
    label: A
    args:
      - --disable-slash-commands
    forbidden_patterns:
      - graphify
    expect_absent:
      - graphify

  - name: graphify
    label: B
    use_index: true
    args:
      - --disable-slash-commands
      - --mcp-config
      - /Users/luka/Projects/skill-cost-bench/.arms/graphify-mcp.json
    append_system_prompt_file: .arms/graphify-SKILL.md
    activation_patterns:
      - "mcp__graphify__"
      - "graphify-out/graph\\.json"
    expect_present:
      - graphify

claim:
  factor: 70.0
  source: "https://github.com/Graphify-Labs/graphify"
  note: >
    71.5x fewer tokens per query than reading the raw files, measured by the
    authors on a 52-file corpus. That is a retrieval claim; this run measures the
    cost of a task carried to green tests.

# USD per million tokens. Cost is computed from token counts against this table
# rather than read from the session's own `total_cost_usd`, which is zero or
# absent on a subscription. Publishing the token counts means a reader can
# re-price the whole run at different rates without re-running it.
pricing:
  source: "https://platform.claude.com/docs/en/about-claude/models/overview"
  dated: "2026-08-06"
  note: >
    Standard list rates. Claude Sonnet 5 carries an introductory $2.00/$10.00
    through 2026-08-31, which covers this run; the standard rate is used because
    it is the one a reader reproducing this later will pay. The choice barely
    moves the headline: the metric is a ratio between two arms, so a uniform
    price change cancels out except through the input/output/cache mix.
    Cache write is 1.25x input at the 5-minute TTL and 2x at one hour; cache
    read is 0.1x input.
  claude-sonnet-5:
    input: 3.00
    output: 15.00
    cache_write_5m: 3.75
    cache_write_1h: 6.00
    cache_read: 0.30
  claude-opus-5:
    input: 5.00
    output: 25.00
    cache_write_5m: 6.25
    cache_write_1h: 10.00
    cache_read: 0.50
  claude-haiku-4-5:
    input: 1.00
    output: 5.00
    cache_write_5m: 1.25
    cache_write_1h: 2.00
    cache_read: 0.10
